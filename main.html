
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm And Alert</title>
</head>
<body>

<script>
    let result = confirm("Do you want to proceed?");

    if (result === true) {
        alert("You clicked OK. Proceeding...");
    } else {
        alert("You clicked Cancel. Exiting...");
    }
</script>

</body>
</html>
